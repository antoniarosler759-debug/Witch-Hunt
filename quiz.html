<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexen-Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #120f1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .quiz-container {
      background-color: #1e1b29;
      border: 2px solid #4a3b69;
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      color: #dfbf60;
      margin-top: 0;
    }

    /* Startseiten-Design */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 20px 0;
    }

    .start-title {
      font-size: 1.8rem;
      color: #dfbf60;
      text-shadow: 0 0 10px rgba(223, 191, 96, 0.4);
      margin: 0;
    }

    /* Leuchtender Start-Button */
    .start-btn {
      position: relative;
      background: #2b233a;
      color: #dfbf60;
      border: 2px solid #dfbf60;
      padding: 15px 45px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(223, 191, 96, 0.6);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .start-btn:hover {
      box-shadow: 0 0 25px rgba(223, 191, 96, 0.9);
      background: #3b2f50;
      transform: scale(1.05);
    }

    /* Krabbelnde Spinne */
    .spider {
      position: absolute;
      top: 50%;
      left: -30px;
      transform: translateY(-50%);
      font-size: 1.2rem;
      pointer-events: none;
      animation: crawl 4s linear infinite;
    }

    @keyframes crawl {
      0% { left: -30px; }
      100% { left: 110%; }
    }
    .question {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button.option-btn {
      background-color: #2e283e;
      color: #ffffff;
      border: 1px solid #6b5299;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.option-btn:hover {
      background-color: #4a3b69;
      border-color: #dfbf60;
    }

    .result-box {
      background-color: #2b233a;
      border: 1px solid #dfbf60;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .restart-btn {
      margin-top: 20px;
      background-color: #dfbf60;
      color: #120f1a;
      border: none;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    .restart-btn:hover {
      background-color: #f7d980;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <h1>✨ Hexen-Quiz ✨</h1>
    <div id="quiz-content">
      <!-- Wird dynamisch per JavaScript befüllt -->
    </div>
  </div>

  <script>
        // Pool aus 20 Zufallsfragen für mehr Atmosphäre
    const extraQuestionsPool = [
      {
        text: "Du betrittst ein altes, nebliges Anwesen im Wald. Welches Geräusch fällt dir zuerst auf?",
        options: ["Das Rascheln von Laub im Wind", "Ein fernes Rufen einer Eule", "Das Knarren einer hölzernen Tür", "Das leise Knistern eines Kessels"]
      },
      {
        text: "Wenn das Licht des Vollmonds auf deine Augen fällt, was spiegeln sie wider?",
        options: ["Eine ruhige, tiefe Nacht", "Ein flackerndes, verborgenes Feuer", "Den Schein eines alten Zauberspiegels", "Das Funkeln von taunassen Blättern"]
      },
      {
        text: "Auf einem alten Eichentisch liegen vier Gegenstände. Zu welchem greift deine Hand instinktiv?",
        options: ["Ein abgewetztes Lederbuch", "Ein geschliffener Bergkristall", "Eine getrocknete Kräuterwurzel", "Eine alte Messingschlüssel-Kette"]
      },
      {
        text: "Welche Tageszeit lässt deine Gedanken am ruhigsten werden?",
        options: ["Die geheimnisvolle Dämmerung", "Die tiefste Mitternacht", "Der frische, neblige Morgen", "Der warme Spätnachmittag"]
      },
      {
        text: "Du läufst durch einen verwunschenen Garten. Welcher Duft liegt in der Luft?",
        options: ["Feuchte Erde und Moos", "Süßer Lavendel und Salbei", "Rauch von brennendem Holz", "Frischer Regen auf heißem Stein"]
      },
      {
        text: "Ein magisches Wesen blickt dich aufmerksam an. Was tut es als Nächstes?",
        options: ["Es verneigt leise den Kopf", "Es umkreist dich aufmerksam", "Es gibt einen sanften Laut von sich", "Es beobachtet dich starr aus dem Schatten"]
      },
      {
        text: "Erinnerst du dich an Träume, die sich ungewöhnlich real angefühlt haben?",
        options: ["Ja, sehr oft – sie begleiten mich am Tag", "Ab und zu, besonders bei Vollmond", "Selten, aber wenn, dann sehr intensiv", "Kaum, ich vergesse sie meist sofort"]
      },
      {
        text: "Ein Windstoß bläst deine Kerze aus. Wie reagierst du im Dunkeln?",
        options: ["Ich bleibe ganz ruhig und schließe die Augen", "Ich suche sofort nach einem Streichholz", "Ich flüstere leise Worte vor mich hin", "Ich warte, bis sich meine Augen anpassen"]
      },
      {
        text: "Der Kessel vor dir fängt an zu brodeln. Welche Farbe nimmt der Rauch an?",
        options: ["Tiefes Violett", "Sanftes Smaragdgrün", "Warmer Goldton", "Silberner Nebel"]
      },
      {
        text: "Welches Element spürst du am stärksten in deiner Nähe?",
        options: ["Die kühle Luft des Windes", "Die Wärme einer knisternden Flamme", "Die Tiefe des klaren Wassers", "Die Ruhe der festen Erde"]
      },
            {
        text: "Welcher Edelstein zieht dich am ehesten an?",
        options: ["Dunkler Obsidian", "Strahlender Amethyst", "Grüner Malachit", "Funkelnder Mondstein"]
      },
      {
        text: "Wie verhältst du dich bei einem schweren Gewitter?",
        options: ["Ich schaue fasziniert aus dem Fenster", "Ich spüre eine seltsame Energie in mir", "Ich ziehe mich an einen gemütlichen Ort zurück", "Ich lausche dem Donner aus der Ferne"]
      },
      {
        text: "Welches Kraut würdest du in deinen Schutztrank mischen?",
        options: ["Beifuß und Thymian", "Rosmarin und Minze", "Kamille und Schafgarbe", "Eisenkraut und Alraune"]
      },
      {
        text: "Ein altes Symbol zeichnet sich im Staub ab. Was bedeutet es für dich?",
        options: ["Schutz vor dunklen Kräften", "Ein Wegweiser in die Zukunft", "Verborgenes Wissen vergangener Zeiten", "Ein Versprechen von Macht"]
      },
      {
        text: "Was wünschst du dir am meisten von einem magischen Artefakt?",
        options: ["Einsicht in verborgene Wahrheiten", "Schutz für meine Liebsten", "Die Fähigkeit, Unsichtbares zu sehen", "Kraft, mein Schicksal zu lenken"]
      },
      {
        text: "Welcher Baum hat für dich die beruhigendste Ausstrahlung?",
        options: ["Uralte Eiche", "Trauerweide am Fluss", "Mächtige Eibe", "Schlanke Birke"]
      },
      {
        text: "Welche Himmelserscheinung fasziniert dich am meisten?",
        options: ["Ein Blutmond am Nachthimmel", "Tanzende Polarlichter", "Ein plötzlicher Sternschnuppenregen", "Ein doppelter Regenbogen im Nebel"]
      },
      {
        text: "Wenn du einen Trank brauen könntest, was sollte er bewirken?",
        options: ["Klare Träume schenken", "Müdigkeit augenblicklich vertreiben", "Gefahren im Voraus spüren", "Gedanken von Ballast befreien"]
      },
      {
        text: "In einer alten Bibliothek steht ein verschlossenes Buch. Welcher Einband fällt dir auf?",
        options: ["Schwarzes Leder mit Rillen", "Samtblau mit gestickten Sternen", "Holz mit eingelegten Runen", "Glattes Pergament mit Goldrand"]
      },
      {
        text: "Welches Wort beschreibt deine Intuition am besten?",
        options: ["Scharf und blitzartig", "Leise, aber stetig", "Plötzlich und tiefgreifend", "Vorsichtig und abwägend"]
      }
    ];
        // Hauptfragen-Baum
    const quizTree = {
      start: {
        text: "1. Welche Augenfarbe hast du?",
        options: [
          { text: "Braun", next: "braun_geschlecht" },
          { text: "Blau", next: "blau_geschlecht" },
          { text: "Grün / Gemischt", next: "gruen_geschlecht" }
        ]
      },

      braun_geschlecht: {
        text: "Welches biologische Geschlecht hast du?",
        options: [
          { text: "Männlich", next: "braun_m_beschreibung" },
          { text: "Weiblich", next: "braun_w_seltsam" }
        ]
      },

      braun_m_beschreibung: {
        text: "Wie würdest du dich am ehesten beschreiben?",
        options: [
          { text: "Vielfältig / Verfressen", next: "res_braun_m_1" },
          { text: "Zurückgezogen", next: "res_braun_m_2" },
          { text: "Hyperaktiv", next: "res_braun_m_3" },
          { text: "Durchschnittlich", next: "res_braun_m_4" }
        ]
      },

      res_braun_m_1: { result: "Mächtige Hexenenergie, aber keine Hexe!" },
      res_braun_m_2: { result: "Ein starrer Magier." },
      res_braun_m_3: { result: "1% Hexengene, woher auch immer die kommen..." },
      res_braun_m_4: { result: "0% Hexe – ganz gewöhnlich menschlich." },

      braun_w_seltsam: {
        text: "Ist dir schon einmal etwas Erstaunliches / Seltsames passiert?",
        options: [
          { text: "Ja", next: "braun_w_familie_ja" },
          { text: "Nein", next: "braun_w_familie_nein" }
        ]
      },

      braun_w_familie_ja: {
        text: "Denkst du, du hast eine Hexe in deiner Familie?",
        options: [
          { text: "Ja", next: "res_braun_w_20" },
          { text: "Nein", next: "res_braun_w_3" }
        ]
      },

      braun_w_familie_nein: {
        text: "Denkst du, du hast eine Hexe in deiner Familie?",
        options: [
          { text: "Ja", next: "res_braun_w_1" },
          { text: "Nein", next: "res_braun_w_0" }
        ]
      },

      res_braun_w_20: { result: "20% Hexengene! Du bist nicht direkt eine Hexe, aber jemand in deiner Familie war es." },
      res_braun_w_3: { result: "3% Hexengene – eine kleine Spur ist da." },
      res_braun_w_1: { result: "1% Hexengene vorhanden." },
      res_braun_w_0: { result: "0% Hexe – keine magischen Spuren." },

      blau_geschlecht: {
        text: "Welches biologische Geschlecht hast du?",
        options: [
          { text: "Männlich", next: "tier_m" },
          { text: "Weiblich", next: "tier_w" }
        ]
      },

      gruen_geschlecht: {
        text: "Welches biologische Geschlecht hast du?",
        options: [
          { text: "Männlich", next: "tier_m" },
          { text: "Weiblich", next: "tier_w" }
        ]
      },
            tier_w: {
        text: "Welches Tier spricht dich am meisten an?",
        options: [
          { text: "Vogelart", next: "w_vogel_seltsam" },
          { text: "Katze", next: "w_katze_seltsam" },
          { text: "Schlange", next: "w_schlange_seltsam" },
          { text: "Kröte", next: "w_kroete_seltsam" }
        ]
      },

      w_vogel_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_w_vogel_ja" }, { text: "Nein", next: "res_w_vogel_nein" }]
      },
      res_w_vogel_ja: { result: "Du hast ausgeprägte Hexengene und vertraust den Lüften!" },
      res_w_vogel_nein: { result: "45% Hexengene – deine Magie schläft noch." },

      w_katze_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_w_katze_ja" }, { text: "Nein", next: "res_w_katze_nein" }]
      },
      res_w_katze_ja: { result: "Sehr hohe Hexenaffinität! Katzen fühlen deine Auraluft." },
      res_w_katze_nein: { result: "5% Hexengene – dein Gespür ist noch schwach." },

      w_schlange_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_w_schlange_ja" }, { text: "Nein", next: "res_w_schlange_nein" }]
      },
      res_w_schlange_ja: { result: "Mächtige, verborgene Magie in deiner Blutlinie!" },
      res_w_schlange_nein: { result: "Spürbare Magie, aber selten genutzt." },

      w_kroete_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_w_kroete_ja" }, { text: "Nein", next: "res_w_kroete_nein" }]
      },
      res_w_kroete_ja: { result: "10% Hexengene mit Erd-Affinität." },
      res_w_kroete_nein: { result: "Legendäre Geschichten, aber keine aktive Hexe." },

      tier_m: {
        text: "Welches Tier spricht dich am meisten an?",
        options: [
          { text: "Vogelart", next: "m_vogel_seltsam" },
          { text: "Katze", next: "m_katze_seltsam" },
          { text: "Schlange", next: "m_schlange_seltsam" },
          { text: "Kröte", next: "m_kroete_seltsam" }
        ]
      },

      m_vogel_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_m_vogel_ja" }, { text: "Nein", next: "res_m_vogel_nein" }]
      },
      res_m_vogel_ja: { result: "Vogel-Aura: Deine Magie zieht durch die Lüfte!" },
      res_m_vogel_nein: { result: "Keine direkten Hexengene nachweisbar." },

      m_katze_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_m_katze_ja" }, { text: "Nein", next: "res_m_katze_nein" }]
      },
      res_m_katze_ja: { result: "Katzen-Magie: Du erkennst die Zeichen der Umgebung." },
      res_m_katze_nein: { result: "Du stehst fest im Leben, keine Hexenenergie." },

      m_schlange_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_m_schlange_ja" }, { text: "Nein", next: "res_m_schlange_nein" }]
      },
      res_m_schlange_ja: { result: "Schlangen-Schutzaura vorhanden!" },
      res_m_schlange_nein: { result: "Ganz normaler Mensch ohne Magie." },

      m_kroete_seltsam: {
        text: "Ist dir schon mal etwas Seltsames passiert?",
        options: [{ text: "Ja", next: "res_m_kroete_ja" }, { text: "Nein", next: "res_m_kroete_nein" }]
      },
      res_m_kroete_ja: { result: "5% Hexengene nachgewiesen." },
      res_m_kroete_nein: { result: "0% Hexe – du schaust eher rational auf die Welt." }
    };
        let isStartPage = true;
    let currentNode = "start";
    let pendingNextMainNode = null;
    let selectedExtraQuestions = [];
    let extraQuestionIndex = 0;

    function prepareRandomExtraQuestions() {
      const shuffled = [...extraQuestionsPool].sort(() => 0.5 - Math.random());
      selectedExtraQuestions = shuffled.slice(0, 10);
      extraQuestionIndex = 0;
    }

    function renderStep() {
      const quizContent = document.getElementById("quiz-content");

      // Startseite anzeigen
      if (isStartPage) {
        quizContent.innerHTML = `
          <div class="start-screen">
            <h2 class="start-title">Hast du das Zeug zur Hexerei?</h2>
            <button class="start-btn" onclick="startQuizFromTitle()">
              Spielen
              <span class="spider">🕷️</span>
            </button>
          </div>
        `;
        return;
      }

      // Quiz-Schritte & Endergebnis
      const step = quizTree[currentNode];

      if (step && step.result) {
        quizContent.innerHTML = `
          <div class="result-box">
            <h2>Dein Ergebnis:</h2>
            <p style="font-size: 1.2rem;">${step.result}</p>
          </div>
          <button class="restart-btn" onclick="restartQuiz()">Quiz neu starten</button>
        `;
      } else {
        let optionsHTML = "";
        step.options.forEach(option => {
          optionsHTML += `<button class="option-btn" onclick="handleMainAnswer('${option.next}')">${option.text}</button>`;
        });

        quizContent.innerHTML = `
          <div class="question">${step.text}</div>
          <div class="options-grid">${optionsHTML}</div>
        `;
      }
    }

    function startQuizFromTitle() {
      isStartPage = false;
      renderStep();
    }

    function handleMainAnswer(nextMainNode) {
      if (extraQuestionIndex < selectedExtraQuestions.length) {
        pendingNextMainNode = nextMainNode;
        showExtraQuestion();
      } else {
        currentNode = nextMainNode;
        renderStep();
      }
    }

    function showExtraQuestion() {
      const quizContent = document.getElementById("quiz-content");
      const extraQ = selectedExtraQuestions[extraQuestionIndex];

      let optionsHTML = "";
      extraQ.options.forEach(optionText => {
        optionsHTML += `<button class="option-btn" onclick="handleExtraAnswer()">${optionText}</button>`;
      });

      quizContent.innerHTML = `
        <div class="question">${extraQ.text}</div>
        <div class="options-grid">${optionsHTML}</div>
      `;
    }

    function handleExtraAnswer() {
      extraQuestionIndex++;

      if (extraQuestionIndex % 2 === 0 || extraQuestionIndex >= selectedExtraQuestions.length) {
        currentNode = pendingNextMainNode;
        pendingNextMainNode = null;
        renderStep();
      } else {
        showExtraQuestion();
      }
    }

    function restartQuiz() {
      isStartPage = true;
      currentNode = "start";
      pendingNextMainNode = null;
      prepareRandomExtraQuestions();
      renderStep();
    }

    prepareRandomExtraQuestions();
    renderStep();
  </script>

</body>
</html>
