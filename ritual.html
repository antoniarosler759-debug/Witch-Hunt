<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Witch-Hunt: Das Ritual & Magie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: 'Georgia', serif; background: #030407; color: #f1f5f9; overflow: hidden; height: 100vh; width: 100vw; }
    
    .screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .screen.active { display: flex; flex-direction: column; }

    /* ELEGANTE GLAS-BUTTONS */
    .btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(147, 197, 253, 0.35);
      color: #e2e8f0;
      padding: 12px 26px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn:hover {
      background: rgba(30, 58, 138, 0.9);
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 30px rgba(96, 165, 250, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
      transform: translateY(-3px);
    }

    /* STARTSEITE WITH MOONREFLECT */
    #start-screen {
      background: radial-gradient(circle at center, #111827 0%, #020408 100%);
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .moon {
      position: absolute;
      top: 10%;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #dbeafe 40%, #86efac 100%);
      box-shadow: 0 0 80px rgba(134, 239, 172, 0.7), 0 0 160px rgba(59, 130, 246, 0.35);
    }
    .lake {
      position: absolute;
      bottom: 0; width: 100%; height: 38%;
      background: linear-gradient(to bottom, #090e17 0%, #020408 100%);
      border-top: 1px solid rgba(134, 239, 172, 0.2);
    }
    .lake-reflection {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 200px; height: 100%;
      background: linear-gradient(to bottom, rgba(134, 239, 172, 0.25), transparent);
      filter: blur(16px);
      animation: ripple 5s infinite alternate ease-in-out;
    }
    @keyframes ripple {
      0% { transform: translateX(-50%) scaleX(1); opacity: 0.25; }
      100% { transform: translateX(-50%) scaleX(1.6); opacity: 0.55; }
    }
    .title {
      z-index: 10; font-size: 3.5rem; margin-bottom: 40px; color: #f8fafc;
      text-shadow: 0 0 35px rgba(134, 239, 172, 0.7);
      letter-spacing: 3px; text-align: center;
    }
    .menu-buttons { z-index: 10; display: flex; gap: 20px; }

    /* DEZENTES SCHWEBENDES TOP-MENÜ */
    .top-bar {
      position: absolute; top: 15px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; pointer-events: none;
    }
    .top-bar * { pointer-events: auto; }
    .glass-panel {
      display: flex; gap: 12px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(15px);
      padding: 8px 18px; border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }
    .select-group { display: flex; gap: 8px; align-items: center; }
    .select-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
    select {
      background: #090d16; color: #f8fafc;
      border: 1px solid rgba(147, 197, 253, 0.35);
      padding: 6px 12px; border-radius: 8px;
      font-family: 'Georgia', serif; cursor: pointer; outline: none;
      transition: border-color 0.2s;
    }
    select:hover { border-color: #60a5fa; }

    #stube-canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }

    /* SPRACHBLASE */
    .speech-bubble {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(96, 165, 250, 0.5);
      color: #f8fafc; padding: 18px 32px; border-radius: 16px;
      max-width: 80%; text-align: center; font-size: 1.2rem;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 30px rgba(59, 130, 246, 0.35);
      z-index: 200; display: none; animation: popUp 0.3s ease-out;
    }
    @keyframes popUp {
      0% { transform: translateX(-50%) scale(0.9); opacity: 0; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    /* RITUAL SCREEN */
    #ritual-screen {
      background: radial-gradient(circle at center, #090d16 0%, #010204 100%);
      justify-content: center; align-items: center;
    }
    .ritual-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 50; background: rgba(2, 4, 8, 0.88); backdrop-filter: blur(10px);
    }
    .ritual-card {
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(25px);
      border: 1px solid rgba(147, 197, 253, 0.25);
      padding: 40px 50px; border-radius: 22px; text-align: center; max-width: 540px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95), 0 0 35px rgba(59, 130, 246, 0.25);
    }
    .ritual-card h2 { font-size: 2.3rem; margin-bottom: 15px; color: #f8fafc; text-shadow: 0 0 20px rgba(255,255,255,0.4); }
    .ritual-card p { font-size: 1.15rem; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
    .sub-text { font-size: 0.9rem !important; color: #64748b !important; margin-top: 6px; font-style: italic; }
  </style>
</head>
<body>
    <!-- STARTSEITE -->
  <div id="start-screen" class="screen active">
    <div class="moon"></div>
    <div class="lake">
      <div class="lake-reflection"></div>
    </div>
    <h1 class="title">Witch-Hunt</h1>
    <div class="menu-buttons">
      <button class="btn" onclick="window.location.href='index.html'">⬅ Hauptseite</button>
      <button class="btn" onclick="showScreen('stube-screen')">🕯️ Hexenstube</button>
      <button class="btn" onclick="showScreen('ritual-screen')">✨ Das Ritual</button>
    </div>
  </div>

  <!-- HEXENSTUBE -->
  <div id="stube-screen" class="screen">
    <div class="top-bar">
      <button class="btn" onclick="showScreen('start-screen')">⬅ Menü</button>
      <div class="glass-panel">
        <div class="select-group">
          <label>Umgebung:</label>
          <select id="location-select" onchange="changeLocation(this.value)">
            <option value="bib">Bibliothek</option>
            <option value="cave">Die Höhle</option>
            <option value="garden">Der Garten</option>
          </select>
        </div>
        <div class="select-group">
          <label>Charakter:</label>
          <select id="char-select" onchange="changeChar(this.value)">
            <option value="amber">Amber (Licht)</option>
            <option value="samantha">Samantha (Pflanzen)</option>
            <option value="ann">Ann (Wind)</option>
            <option value="caroline">Caroline (Teleport)</option>
          </select>
        </div>
        <button id="reset-btn" class="btn" style="display:none; background:rgba(136, 19, 55, 0.85); border-color:#f43f5e;" onclick="resetEnvironment()">🔄 Reset</button>
      </div>
    </div>

    <div id="stube-canvas-container">
      <canvas id="stube-canvas"></canvas>
    </div>
    
    <div id="speech-bubble" class="speech-bubble"></div>
  </div>

  <!-- RITUAL SPIEL -->
  <div id="ritual-screen" class="screen">
    <div class="top-bar">
      <button class="btn" onclick="exitRitual()">⬅ Menü</button>
      <div class="glass-panel" style="padding: 8px 18px; color: #94a3b8; font-size: 0.95rem;">
        ⚡ Beschütze den Malvorrithen vor den Blitzen!
      </div>
    </div>
    
    <canvas id="ritual-canvas"></canvas>

    <div id="ritual-start-overlay" class="ritual-overlay">
      <div class="ritual-card">
        <h2>Das Drei-Becher-Ritual</h2>
        <p>Halte den gelben Malvorrithen gedrückt und weiche den drohenden Schatten der Blitze aus. Nach jeder Runde füllt sich ein Becher mit Blut!</p>
        <div style="display:flex; gap:15px; justify-content:center;">
          <button class="btn" onclick="startRitualGame()">Ritual starten</button>
          <button class="btn" onclick="exitRitual()">Zurück</button>
        </div>
      </div>
    </div>

    <div id="ritual-end-overlay" class="ritual-overlay" style="display:none;">
      <div class="ritual-card">
        <h2 id="ritual-end-title"></h2>
        <p id="ritual-end-desc"></p>
        <p id="ritual-end-sub" class="sub-text"></p>
        <div style="display:flex; gap:15px; justify-content:center; margin-top:25px;">
          <button class="btn" onclick="startRitualGame()">Noch einmal</button>
          <button class="btn" onclick="exitRitual()">Zurück zum Menü</button>
        </div>
      </div>
    </div>
  </div>
    <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if(id === 'stube-screen') initStube();
      if(id === 'ritual-screen') initRitualCanvas();
    }

    let stubeCanvas, stubeCtx;
    let currentLocation = 'bib';
    let currentChar = 'amber';
    let timeOfDay = 0; 
    let torchesLit = true;
    let malvorrithFloating = false;
    let malvorrithHover = 0;
    let malvorrithCovered = false;
    let malvorrithDestroyed = false;
    let malvorrithPos = { x: 0, y: 0 };
    let bookshelfDestroyed = false;
    let windowsDestroyed = false;
    let curtainsDestroyed = false;
    let curtainsOpen = true;
    let objBounds = {};
    let particles = [];
    let lightTrails = [];
    let drawings = [];
    let greenRings = [];
    let grassBlades = [];
    let clouds = [];

    function initStube() {
      stubeCanvas = document.getElementById('stube-canvas');
      stubeCtx = stubeCanvas.getContext('2d');
      resizeCanvas(stubeCanvas);
      window.addEventListener('resize', () => resizeCanvas(stubeCanvas));
      
      grassBlades = [];
      for(let i=0; i<160; i++) {
        grassBlades.push({
          x: Math.random() * window.innerWidth,
          height: Math.random() * 40 + 25,
          speed: Math.random() * 0.04 + 0.01,
          offset: Math.random() * Math.PI * 2
        });
      }
      for(let i=0; i<6; i++) {
        clouds.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * 140 + 20,
          scale: Math.random() * 0.8 + 0.5,
          speed: Math.random() * 0.15 + 0.05
        });
      }

      setupStubeEvents();
      requestAnimationFrame(updateStube);
    }

    function resizeCanvas(c) { c.width = window.innerWidth; c.height = window.innerHeight; }
    function changeLocation(loc) { currentLocation = loc; resetEnvironment(); }
    function changeChar(c) { currentChar = c; document.getElementById('reset-btn').style.display = (c === 'ann') ? 'block' : 'none'; }

    function resetEnvironment() {
      bookshelfDestroyed = false; windowsDestroyed = false; curtainsDestroyed = false;
      curtainsOpen = true; malvorrithCovered = false; malvorrithDestroyed = false;
      torchesLit = true; particles = []; lightTrails = []; drawings = []; greenRings = [];
      hideSpeech();
    }

    function updateStube(timestamp) {
      if(!document.getElementById('stube-screen').classList.contains('active')) return;
      timeOfDay = (timestamp % 600000) / 600000;
      malvorrithHover = Math.sin(timestamp / 350) * 14;
      drawStubeScene(timestamp);
      updateStubeEffects();
      requestAnimationFrame(updateStube);
    }

    function drawStubeScene(timestamp) {
      stubeCtx.clearRect(0, 0, stubeCanvas.width, stubeCanvas.height);
      const w = stubeCanvas.width, h = stubeCanvas.height;

      if(currentLocation === 'bib') {
        let sunProgress = Math.sin(timeOfDay * Math.PI * 2);
        let daylight = Math.max(0.12, (sunProgress + 1) / 2);
        
        let bgGrad = stubeCtx.createLinearGradient(0, 0, 0, h);
        bgGrad.addColorStop(0, `rgb(${Math.floor(20*daylight)}, ${Math.floor(15*daylight)}, ${Math.floor(30*daylight)})`);
        bgGrad.addColorStop(1, `rgb(${Math.floor(5*daylight)}, ${Math.floor(4*daylight)}, ${Math.floor(10*daylight)})`);
        stubeCtx.fillStyle = bgGrad; stubeCtx.fillRect(0, 0, w, h);

        objBounds.window1 = { x: w*0.12, y: h*0.08, w: w*0.16, h: h*0.52 };
        objBounds.window2 = { x: w*0.72, y: h*0.08, w: w*0.16, h: h*0.52 };

        [objBounds.window1, objBounds.window2].forEach(win => {
          if(!windowsDestroyed) {
            stubeCtx.fillStyle = `rgba(${Math.floor(140*daylight)}, ${Math.floor(190*daylight)}, ${Math.floor(255*daylight)}, 0.85)`;
            stubeCtx.fillRect(win.x, win.y, win.w, win.h);
            stubeCtx.strokeStyle = '#110c05'; stubeCtx.lineWidth = 10; stubeCtx.strokeRect(win.x, win.y, win.w, win.h);
            
            if(!curtainsDestroyed) {
              stubeCtx.fillStyle = '#5c0617';
              let curtainW = curtainsOpen ? win.w * 0.2 : win.w * 0.52;
              stubeCtx.fillRect(win.x, win.y, curtainW, win.h);
              stubeCtx.fillRect(win.x + win.w - curtainW, win.y, curtainW, win.h);
            }
          }
        });

        objBounds.carpet = { x: w*0.2, y: h*0.62, w: w*0.6, h: h*0.35 };
        stubeCtx.fillStyle = '#500724';
        stubeCtx.beginPath(); stubeCtx.ellipse(w*0.5, h*0.82, w*0.34, h*0.15, 0, 0, Math.PI*2); stubeCtx.fill();
        stubeCtx.strokeStyle = '#eab308'; stubeCtx.lineWidth = 3; stubeCtx.stroke();

        objBounds.bookshelf = { x: w*0.3, y: h*0.15, w: w*0.4, h: h*0.62 };
        if(!bookshelfDestroyed) {
          stubeCtx.fillStyle = '#211003'; stubeCtx.fillRect(objBounds.bookshelf.x, objBounds.bookshelf.y, objBounds.bookshelf.w, objBounds.bookshelf.h);
          for(let i=0; i<4; i++) {
            let shelfY = objBounds.bookshelf.y + 40 + i*78;
            stubeCtx.fillStyle = '#0f0701'; stubeCtx.fillRect(objBounds.bookshelf.x + 12, shelfY, objBounds.bookshelf.w - 24, 14);
            for(let j=0; j<16; j++) {
              stubeCtx.fillStyle = ['#7f1d1d', '#1e3a8a', '#14532d', '#713f12', '#4c1d95'][j%5];
              stubeCtx.fillRect(objBounds.bookshelf.x + 20 + j*21, shelfY - 55, 17, 55);
            }
          }
        } else {
          stubeCtx.fillStyle = '#211003'; stubeCtx.fillRect(objBounds.bookshelf.x - 60, h*0.7, objBounds.bookshelf.w + 120, 50);
          stubeCtx.fillStyle = '#fef3c7';
          for(let i=0; i<20; i++) stubeCtx.fillRect(w*0.25 + (i*24)%280, h*0.72 + (i*12)%75, 18, 22);
        }

        objBounds.candle = { x: w*0.08, y: h*0.55, w: 45, h: 100 };
        stubeCtx.fillStyle = '#ca8a04'; stubeCtx.fillRect(objBounds.candle.x, objBounds.candle.y, 12, 100); stubeCtx.fillRect(objBounds.candle.x - 20, objBounds.candle.y, 52, 8);
        if(torchesLit) {
          let flicker = Math.sin(timestamp / 80) * 4;
          let flameGrad = stubeCtx.createRadialGradient(objBounds.candle.x + 6, objBounds.candle.y - 15, 2, objBounds.candle.x + 6, objBounds.candle.y - 25 + flicker, 25);
          flameGrad.addColorStop(0, '#fef08a');
          flameGrad.addColorStop(0.5, '#f97316');
          flameGrad.addColorStop(1, 'transparent');
          stubeCtx.fillStyle = flameGrad;
          stubeCtx.beginPath(); stubeCtx.arc(objBounds.candle.x + 6, objBounds.candle.y - 20, 25, 0, Math.PI*2); stubeCtx.fill();
        }

      } else if(currentLocation === 'cave') {
        stubeCtx.fillStyle = '#020408'; stubeCtx.fillRect(0, 0, w, h);
        
        objBounds.torch1 = { x: w*0.06, y: h*0.25, w: 35, h: 65 };
        objBounds.torch2 = { x: w*0.88, y: h*0.25, w: 35, h: 65 };
        [objBounds.torch1, objBounds.torch2].forEach(t => {
          stubeCtx.fillStyle = '#1e293b'; stubeCtx.fillRect(t.x, t.y, t.w, t.h);
          if(torchesLit) {
            stubeCtx.fillStyle = '#22c55e';
            stubeCtx.shadowColor = '#22c55e'; stubeCtx.shadowBlur = 20;
            stubeCtx.beginPath(); stubeCtx.arc(t.x + 17, t.y - 12, 16, 0, Math.PI*2); stubeCtx.fill();
            stubeCtx.shadowBlur = 0;
          }
        });

        stubeCtx.fillStyle = '#0f172a'; stubeCtx.beginPath();
        let cx = w*0.5, cy = h*0.75, outerR = w*0.3, innerR = w*0.15;
        for(let i=0; i<10; i++) {
          let r = (i % 2 === 0) ? outerR : innerR;
          let angle = (i * Math.PI / 5) - Math.PI/2;
          let x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * (r * 0.36);
          if(i===0) stubeCtx.moveTo(x,y); else stubeCtx.lineTo(x,y);
        }
        stubeCtx.closePath(); stubeCtx.fill(); 
        stubeCtx.strokeStyle = '#334155'; stubeCtx.lineWidth = 4; stubeCtx.stroke();

        stubeCtx.fillStyle = '#15803d';
        for(let i=0; i<12; i++) {
          let weedX = cx + Math.sin(i*12) * (outerR * 0.7);
          let weedY = cy + Math.cos(i*8) * 40 + Math.sin(timestamp/500 + i)*2;
          stubeCtx.fillRect(weedX, weedY, 4, 12);
        }

        let altarY = h*0.6;
        stubeCtx.fillStyle = '#334155'; stubeCtx.beginPath(); stubeCtx.ellipse(w*0.5, altarY, 90, 32, 0, 0, Math.PI*2); stubeCtx.fill();

        if(malvorrithPos.x === 0) malvorrithPos = { x: w*0.5, y: altarY - 35 };
        objBounds.malvorrith = { x: malvorrithPos.x - 24, y: malvorrithPos.y - 32, w: 48, h: 64 };

        if(!malvorrithDestroyed) {
          let mY = malvorrithPos.y + (malvorrithFloating ? malvorrithHover : 0);
          if(malvorrithCovered) {
            stubeCtx.fillStyle = '#166534'; stubeCtx.beginPath(); stubeCtx.arc(malvorrithPos.x, mY, 32, 0, Math.PI*2); stubeCtx.fill();
          } else {
            stubeCtx.shadowColor = '#eab308'; stubeCtx.shadowBlur = 30;
            stubeCtx.fillStyle = '#fde047';
            stubeCtx.beginPath();
            stubeCtx.moveTo(malvorrithPos.x, mY - 30); stubeCtx.lineTo(malvorrithPos.x + 22, mY);
            stubeCtx.lineTo(malvorrithPos.x, mY + 30); stubeCtx.lineTo(malvorrithPos.x - 22, mY);
            stubeCtx.closePath(); stubeCtx.fill();
            stubeCtx.shadowBlur = 0;
          }
        }

      } else if(currentLocation === 'garden') {
        let sunProgress = Math.sin(timeOfDay * Math.PI * 2);
        let skyRed = Math.floor(15 + Math.max(0, sunProgress) * 60);
        let skyGreen = Math.floor(20 + Math.max(0, sunProgress) * 80);
        let skyBlue = Math.floor(40 + Math.max(0, sunProgress) * 120);

        let gGrad = stubeCtx.createLinearGradient(0, 0, 0, h);
        gGrad.addColorStop(0, `rgb(${skyRed}, ${skyGreen}, ${skyBlue})`);
        gGrad.addColorStop(1, '#022c22');
        stubeCtx.fillStyle = gGrad; stubeCtx.fillRect(0, 0, w, h);

        stubeCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        clouds.forEach(cl => {
          cl.x += cl.speed;
          if(cl.x > w + 100) cl.x = -100;
          stubeCtx.beginPath();
          stubeCtx.arc(cl.x, cl.y, 40 * cl.scale, 0, Math.PI*2);
          stubeCtx.arc(cl.x + 30 * cl.scale, cl.y - 10, 30 * cl.scale, 0, Math.PI*2);
          stubeCtx.fill();
        });

        stubeCtx.fillStyle = '#064e3b'; stubeCtx.fillRect(0, h*0.55, w, h*0.45);

        stubeCtx.strokeStyle = '#059669'; stubeCtx.lineWidth = 2.5;
        grassBlades.forEach((g, idx) => {
          let sway = Math.sin(timestamp * g.speed + g.offset) * 10;
          let gx = (g.x + idx * 12) % w;
          let gy = h*0.55;

           <script>
    /* ===================================================
       DAS RITUAL SPIEL-LOGIK
    =================================================== */
    let ritualCanvas, ritualCtx, gameActive = false, round = 1, bloodCups = 0, malPos = { x: 0, y: 0 }, isDraggingMal = false;
    let lightnings = [], shadows = [], gameLoopId = null, roundTimer = 0;

    function initRitualCanvas() { 
      ritualCanvas = document.getElementById('ritual-canvas'); 
      ritualCtx = ritualCanvas.getContext('2d'); 
      resizeCanvas(ritualCanvas); 
    }

    function startRitualGame() {
      document.getElementById('ritual-start-overlay').style.display = 'none';
      document.getElementById('ritual-end-overlay').style.display = 'none';
      round = 1; bloodCups = 0; gameActive = true;
      malPos = { x: ritualCanvas.width / 2, y: ritualCanvas.height / 2 };
      setupRitualEvents(); startRound();
      if(gameLoopId) cancelAnimationFrame(gameLoopId);
      gameLoopId = requestAnimationFrame(updateRitualGame);
    }

    function startRound() { shadows = []; lightnings = []; roundTimer = 0; }

    function setupRitualEvents() {
      ritualCanvas.onmousedown = (e) => { 
        if(Math.hypot(e.clientX - malPos.x, e.clientY - malPos.y) < 35) isDraggingMal = true; 
      };
      ritualCanvas.onmousemove = (e) => {
        if(isDraggingMal && gameActive) {
          let tx = e.clientX, ty = e.clientY;
          if(round === 3) tx -= (tx - ritualCanvas.width/2) * 0.3; // Zugkraft der Ranken
          malPos.x = tx; malPos.y = ty;
        }
      };
      ritualCanvas.onmouseup = () => { isDraggingMal = false; };
    }

    function updateRitualGame() {
      if(!gameActive) return;
      ritualCtx.clearRect(0, 0, ritualCanvas.width, ritualCanvas.height);
      const w = ritualCanvas.width, h = ritualCanvas.height;

      // Waldlichtung
      ritualCtx.fillStyle = '#020408'; ritualCtx.fillRect(0, 0, w, h);
      
      // Leuchtender Vollmond
      ritualCtx.fillStyle = '#fef08a';
      ritualCtx.shadowColor = '#fef08a'; ritualCtx.shadowBlur = 45;
      ritualCtx.beginPath(); ritualCtx.arc(w/2, 100, 60, 0, Math.PI*2); ritualCtx.fill();
      ritualCtx.shadowBlur = 0;

      // Die 3 goldenen Becher am Boden
      for(let i=0; i<3; i++) {
        let cx = w/2 - 120 + i*120, cy = h - 90;
        ritualCtx.fillStyle = '#eab308'; ritualCtx.fillRect(cx - 22, cy - 35, 44, 45);
        if(i < bloodCups) {
          ritualCtx.fillStyle = '#dc2626';
          ritualCtx.fillRect(cx - 18, cy - 28, 36, 35);
        }
      }

      roundTimer++;
      let spawnRate = Math.max(20, 80 - round * 20);
      if(roundTimer % spawnRate === 0) {
        shadows.push({ x: Math.random() * (w - 120) + 60, y: Math.random() * (h - 250) + 120, radius: 38, timer: 45 });
      }

      // Blitz-Schatten
      shadows.forEach((s, idx) => {
        ritualCtx.fillStyle = 'rgba(0, 0, 0, 0.75)'; 
        ritualCtx.beginPath(); ritualCtx.arc(s.x, s.y, s.radius, 0, Math.PI*2); ritualCtx.fill();
        s.timer--;
        if(s.timer <= 0) {
          lightnings.push({ x: s.x, y: s.y, duration: 12 });
          if(Math.hypot(malPos.x - s.x, malPos.y - s.y) < 42) triggerRitualLoss();
          shadows.splice(idx, 1);
        }
      });

      // Blitze
      lightnings.forEach((l, idx) => {
        ritualCtx.strokeStyle = '#38bdf8'; ritualCtx.lineWidth = 8;
        ritualCtx.shadowColor = '#38bdf8'; ritualCtx.shadowBlur = 22;
        ritualCtx.beginPath(); ritualCtx.moveTo(l.x, 0); ritualCtx.lineTo(l.x, l.y); ritualCtx.stroke();
        ritualCtx.shadowBlur = 0;
        l.duration--; if(l.duration <= 0) lightnings.splice(idx, 1);
      });

      // Gelber Malvorrith
      ritualCtx.shadowColor = '#eab308'; ritualCtx.shadowBlur = 28;
      ritualCtx.fillStyle = '#fde047'; ritualCtx.beginPath();
      ritualCtx.moveTo(malPos.x, malPos.y - 28); ritualCtx.lineTo(malPos.x + 20, malPos.y);
      ritualCtx.lineTo(malPos.x, malPos.y + 28); ritualCtx.lineTo(malPos.x - 20, malPos.y);
      ritualCtx.closePath(); ritualCtx.fill();
      ritualCtx.shadowBlur = 0;

      // Runden-Fortschritt
      if(roundTimer > 500) {
        bloodCups++;
        if(round < 3) { round++; startRound(); } else { triggerRitualWin(); }
      }
      gameLoopId = requestAnimationFrame(updateRitualGame);
    }

    function triggerRitualWin() {
      gameActive = false;
      document.getElementById('ritual-end-title').innerText = "Herzlichen Glückwunsch!";
      document.getElementById('ritual-end-desc').innerText = "Du hast das Ritual erfolgreich beenden können.";
      document.getElementById('ritual-end-sub').innerText = "War es das wert?";
      document.getElementById('ritual-end-overlay').style.display = 'flex';
    }

    function triggerRitualLoss() {
      gameActive = false;
      document.getElementById('ritual-end-title').innerText = "Schade!";
      document.getElementById('ritual-end-desc').innerText = "Vielleicht beim nächsten Mal.";
      document.getElementById('ritual-end-sub').innerText = "Lieber nicht.";
      document.getElementById('ritual-end-overlay').style.display = 'flex';
    }

    function exitRitual() {
      gameActive = false;
      if(gameLoopId) cancelAnimationFrame(gameLoopId);
      showScreen('start-screen');
    }
  </script>
</body>
</html>
