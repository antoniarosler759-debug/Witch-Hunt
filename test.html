<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witch-Hunt Quiz – Kinder der verlorenen Zeit</title>
    <style>
        :root {
            --bg-color: #0f0d13;
            --card-bg: #1a1722;
            --accent-green: #2ecc71;
            --accent-purple: #8e44ad;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2d2838;
            --wrong-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(142, 68, 173, 0.5);
        }

        p.subtitle {
            color: var(--accent-green);
            font-style: italic;
            font-size: 1.1rem;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border-left: 4px solid var(--accent-purple);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #231f2e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: #2d283d;
            border-color: var(--accent-purple);
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--accent-purple);
            transform: scale(1.2);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-purple), #6c3483);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.4);
        }

        #result-screen {
            display: none;
            text-align: center;
        }

        .score-box {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .emoji-display {
            font-size: 5rem;
            margin: 15px 0;
        }

        .percentage {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        .explanation {
            margin-top: 10px;
            padding: 10px;
            background: rgba(46, 204, 113, 0.1);
            border-left: 3px solid var(--accent-green);
            font-size: 0.95rem;
            color: var(--text-color);
            display: none;
        }

        .correct-answer {
            background: rgba(46, 204, 113, 0.2) !important;
            border-color: var(--accent-green) !important;
            color: #ffffff;
        }

        .wrong-answer {
            background: rgba(231, 76, 60, 0.2) !important;
            border-color: var(--wrong-color) !important;
        }

        .btn-restart {
            margin-top: 30px;
            background: #34495e;
        }

        .btn-restart:hover {
            background: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Witch-Hunt</h1>
        <p class="subtitle">Kinder der verlorenen Zeit – Selbsttest Quiz</p>
    </header>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="submit" class="btn-submit">Quiz auswerten</button>
    </form>

    <div id="result-screen">
        <h2>Dein Ergebnis</h2>
        <div class="score-box">
            <div class="emoji-display" id="result-emoji"></div>
            <div class="percentage" id="result-percent">0%</div>
            <p id="result-text" style="margin-top: 10px; font-size: 1.1rem;"></p>
        </div>

        <div id="review-container" style="text-align: left; margin-top: 30px;">
            <h3>Auflösung & Erklärungen:</h3>
        </div>

        <button type="button" class="btn-submit btn-restart" onclick="location.reload()">Quiz nochmal machen</button>
    </div>
</div>
  <script>
const quizData = [
    {
        question: "1. Welches unverkennbare biologische Merkmal vereint alle echten Hexen in der Welt von Witch-Hunt?",
        options: ["A) Silberne Haare", "B) Eine Brandnarbe am Handgelenk", "C) Grüne Augen", "D) Eine unnatürlich tiefe Stimme"],
        correct: 2,
        explanation: "Alle echten Hexen besitzen grüne Augen. Zwar gibt es auch normale Menschen mit dieser Augenfarbe, aber unter Hexen ist es das universelle Erkennungsmerkmal."
    },
    {
        question: "2. Ab welchem Alter nimmt das Elite-Waisenhaus St. Gray regulär Kinder auf?",
        options: ["A) Ab Geburt (Säuglinge)", "B) Ab 6 Jahren", "C) Ab 8 Jahren", "D) Ab 12 Jahren"],
        correct: 2,
        explanation: "St. Gray hat eine strikte Altersgrenze und nimmt Kinder erst ab 8 Jahren auf. Jüngere Kinder oder abgelegte Babys bilden absolute Ausnahmen und werden meist weitervermittelt."
    },
    {
        question: "3. Welche rein mentale Fähigkeit besitzt die Hauptprotagonistin Amber Park, die bei ihr starkes Schlafwandeln verursacht?",
        options: ["A) Sie kann die Auren anderer Menschen lesen", "B) Sie kann Gedanken manipulieren", "C) Sie kann durch Wände sehen", "D) Sie kann intensive Visionen sehen"],
        correct: 3,
        explanation: "Ambers Magie ist rein mental. Sie kann zwar keine Auren lesen, wird dafür aber von so intensiven Visionen gejagt, dass sie als Nebeneffekt schlafwandelt."
    },
    {
        question: "4. Was wird in der ersten Nacht des berüchtigten „Drei-Becher-Rituals“ bereitgestellt?",
        options: ["A) Das Herz einer Hexe (Malvorrith)", "B) Das Blut eines Unschuldigen", "C) Das Blut der Hexe selbst", "D) Reines Quellwasser"],
        correct: 2,
        explanation: "Das Ritual erstreckt sich über drei Nächte unter dem Vollmond. In der allerersten Nacht muss das Blut der Hexe bereitgestellt werden."
    },
    {
        question: "5. Aus welchen Komponenten wird ein „Malvorrith“ (auch Hexenherz genannt) geformt?",
        options: ["A) Aus Gold, Silber und flüssigem Blut", "B) Aus verbrannter Asche und Mondgestein", "C) Aus dem Blut, den Knochen und dem Herzen einer Hexe", "D) Aus geschmolzenen Ritualbechern"],
        correct: 2,
        explanation: "Der Malvorrith ist ein extrem gefährlicher und verpönter Ritualstein, der aus dem Blut, den Knochen und dem echten Herzen einer Hexe erschaffen wird – seine Existenz gilt in der Hexengesellschaft als Beweis für einen Mord."
    },
    {
        question: "6. Warum ist Samantha Grays charakterlich so unnahbar, arbeitet aber insgeheim aktiv gegen die böse Direktorin Ann Grays?",
        options: ["A) Sie wurde von Ann aus dem Waisenhaus geworfen.", "B) Sie will selbst die alleinige Macht über das Wind-Element.", "C) Sie ist Anns leibliche Nichte, steht aber auf der Seite der Kinder.", "D) Sie wurde von Caroline Blackthorne dazu gezwungen."],
        correct: 2,
        explanation: "Das ist der große Plot-Twist: Obwohl Samantha die leibliche Nichte der tyrannischen Direktorin ist, nutzt sie Ambers Visionen gezielt, um ihrer Tante das Handwerk zu legen."
    },
    {
        question: "7. Welcher Charakter fällt optisch sofort durch auffällige silberne Haare und ein ständiges schelmisches Grinsen auf?",
        options: ["A) Elizabeth Everhart", "B) Mary Norack", "C) Caroline Blackthorne", "D) Ann Grays"],
        correct: 2,
        explanation: "Caroline Blackthorne, die mächtige Hexe der Manipulation, bildet eine ganz eigene unberechenbare Partei und verbreitet durch ihr Auftreten pure Angst und Schrecken."
    },
    {
        question: "8. Warum stellt der junge Polizist in Ausbildung, Mason Cater, überhaupt eigene Nachforschungen zum Waisenhaus St. Gray an?",
        options: ["A) Er sucht nach seinen leiblichen Eltern Bianka und Jeffrey.", "B) Er hat einen offiziellen Durchsuchungsbefehl von der Londoner Polizei.", "C) Er verlor selbst früh seine Eltern und machte schlechte Erfahrungen in einem anderen Waisenhaus.", "D) Er hat selbst grüne Augen und vermutet, ein Hexer zu sein."],
        correct: 2,
        explanation: "Mason hat einen extremen Gerechtigkeitssinn. Da sein erstes Waisenhaus wegen gewalttätiger Erzieher geschlossen wurde, ist er gegenüber dem „Elite-Waisenhaus“ St. Gray von Natur aus misstrauisch."
    },
    {
        question: "9. Welches Schicksal ereilt den schüchternen neunjährigen Lennard, der sich mit Ambers kleiner Schwester Alice angefreundet hat?",
        options: ["A) Er wird von einer Gastfamilie adoptiert.", "B) Er entpuppt sich ebenfalls als mächtiger Hexer.", "C) Er fällt leider dem grausamen Drei-Becher-Ritual zum Opfer.", "D) Er flieht gemeinsam mit Ambers Bruder Finn aus dem Waisenhaus."],
        correct: 2,
        explanation: "Der kleine Lennard, der als Baby im St. Gray abgegeben wurde, gehört leider zu den unschuldigen Kindern, die dem Ritual der Hexen zum Opfer fallen."
    },
    {
        question: "10. Welcher fatale Fehler führt am Ende von Band 1 zum Untergang der jahrhundertealten Althexe Ann Grays?",
        options: ["A) Sie unterschätzte die polizeilichen Ermittlungen von Mason.", "B) Ihr Hochmut sorgte dafür, dass sie eine gefälschte Kopie des Magievorrats nicht überprüfte.", "C) Sie unterschätzte die körperliche Stärke von Finn Park.", "D) Sie vergaß, ihr eigenes Blut für das Drei-Becher-Ritual bereitzustellen."],
        correct: 1,
        explanation: "Anns Stolz war ihr Untergang. Sie glaubte nicht, dass Samantha sie überlisten könnte. Beim Ritual zersprang der gefälschte Magievorrat und entzog ihr massiv Energie, sodass sie geschwächt vom Kronleuchter erschlagen werden konnte."
    }
];

const questionsContainer = document.getElementById('questions-container');

quizData.forEach((q, index) => {
    const qBlock = document.createElement('div');
    qBlock.className = 'question-block';
    qBlock.id = `q-block-${index}`;

    let optionsHTML = '';
    q.options.forEach((opt, optIndex) => {
        optionsHTML += `
            <li class="option-item">
                <label class="option-label" id="label-${index}-${optIndex}">
                    <input type="radio" name="question-${index}" value="${optIndex}" required>
                    ${opt}
                </label>
            </li>
        `;
    });

    qBlock.innerHTML = `
        <div class="question-text">${q.question}</div>
        <ul class="options-list">${optionsHTML}</ul>
        <div class="explanation" id="exp-${index}">
            <strong>Erklärung:</strong> ${q.explanation}
        </div>
    `;
    questionsContainer.appendChild(qBlock);
});

document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();

    let score = 0;
    const total = quizData.length;

    quizData.forEach((q, index) => {
        const selected = document.querySelector(`input[name="question-${index}"]:checked`);
        const selectedValue = selected ? parseInt(selected.value) : -1;

        document.getElementById(`exp-${index}`).style.display = 'block';

        q.options.forEach((_, optIndex) => {
            const label = document.getElementById(`label-${index}-${optIndex}`);
            if (optIndex === q.correct) {
                label.classList.add('correct-answer');
            } else if (optIndex === selectedValue) {
                label.classList.add('wrong-answer');
            }
            label.querySelector('input').disabled = true;
        });

        if (selectedValue === q.correct) {
            score++;
        }
    });

    const percentage = Math.round((score / total) * 100);

    let emoji = '';
    let text = '';

    if (percentage < 50) {
        emoji = '😡';
        text = 'Die Hexen sind wütend auf dich! Du solltest Band 1 dringend noch einmal lesen.';
    } else if (percentage <= 60) {
        emoji = '🤨';
        text = 'Ein skeptischer Blick... Du kennst zwar ein paar Details, bist dir aber noch recht unsicher.';
    } else if (percentage <= 80) {
        emoji = '😏';
        text = 'Gar nicht übel! Du hast ein gutes Wissen über die Ereignisse in St. Gray.';
    } else {
        emoji = '🧙‍♀️';
        text = 'Perfekt! Du kennst dich zu 100% aus und durchschaust selbst die geheimsten Rituale!';
    }

    document.getElementById('quiz-form').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-percent').textContent = `${percentage}% (${score} von ${total} richtig)`;
    document.getElementById('result-text').textContent = text;

    document.getElementById('review-container').appendChild(questionsContainer);
    window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>

</body>
</html>
