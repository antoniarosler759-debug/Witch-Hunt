<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witch-Hunt Quiz – Kinder der verlorenen Zeit</title>
    <style>
        :root {
            --bg-color: #0f0d13;
            --card-bg: #1a1722;
            --accent-green: #2ecc71;
            --accent-purple: #8e44ad;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2d2838;
            --wrong-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(142, 68, 173, 0.5);
        }

        p.subtitle {
            color: var(--accent-green);
            font-style: italic;
            font-size: 1.1rem;
        }

        .progress-indicator {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-block {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border-left: 4px solid var(--accent-purple);
        }
                .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #231f2e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: #2d283d;
            border-color: var(--accent-purple);
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--accent-purple);
            transform: scale(1.2);
        }

        .btn-next {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-purple), #6c3483);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 20px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.4);
        }

        #result-screen {
            display: none;
            text-align: center;
        }

        .score-box {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .emoji-display {
            font-size: 5rem;
            margin: 15px 0;
        }

        .percentage {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        .review-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid var(--border-color);
        }

        .review-item.is-correct {
            border-left-color: var(--accent-green);
        }

        .review-item.is-wrong {
            border-left-color: var(--wrong-color);
        }

        .explanation {
            margin-top: 10px;
            padding: 10px;
            background: rgba(46, 204, 113, 0.1);
            border-left: 3px solid var(--accent-green);
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .correct-answer-text {
            color: var(--accent-green);
            font-weight: bold;
        }

        .wrong-answer-text {
            color: var(--wrong-color);
            text-decoration: line-through;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            color: white;
            transition: background-color 0.2s;
        }

        .btn-restart {
            background: #34495e;
        }

        .btn-restart:hover {
            background: #2c3e50;
        }

        .btn-home {
            background: var(--accent-purple);
        }

        .btn-home:hover {
            background: #6c3483;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Witch-Hunt</h1>
        <p class="subtitle">Kinder der verlorenen Zeit – Selbsttest Quiz</p>
    </header>

    <div id="quiz-container">
        <div class="progress-indicator" id="progress-indicator">Frage 1 von 10</div>
        <div id="active-question-card"></div>
        <button type="button" class="btn-next" id="btn-next" onclick="handleNextQuestion()">Nächste Frage</button>
    </div>

    <div id="result-screen">
        <h2>Dein Ergebnis</h2>
        <div class="score-box">
            <div class="emoji-display" id="result-emoji"></div>
            <div class="percentage" id="result-percent">0%</div>
            <p id="result-text" style="margin-top: 10px; font-size: 1.1rem;"></p>
        </div>

        <div id="review-container" style="margin-top: 30px;">
            <h3>Auflösung & Erklärungen aller Fragen:</h3>
            <div id="review-list" style="margin-top: 15px;"></div>
        </div>

        <div class="action-buttons">
            <button type="button" class="btn-action btn-restart" onclick="location.reload()">Quiz nochmal machen</button>
            <a href="index.html" class="btn-action btn-home">⬅️ Zurück zur Hauptseite</a>
        </div>
    </div>
</div>

<script>

    },
            {
        question: "In welcher bekannten Großstadt haben die liebevollen, aber plötzlich spurlos verschwundenen Eltern Bianka und Jeffrey ihre Kinder großgezogen?",
        options: ["Edinburgh", "London", "Dublin", "Manchester"],
        correctIndex: 1,

    },

        question: "Warum wird Ambers großer Bruder, Finn Park, regelmäßig von der pragmatischen Samantha als dumm beschimpft?",
        options: ["Weil er die magischen Geheimnisse im Waisenhaus verraten hat.", "Weil er heimlich für die tyrannische Direktorin arbeitet.", "Weil er ein normaler Mensch ohne jede magische Begabung ist.", "Aus reinem Spott, weil er sehr hitzköpfig ist und sie ihn deshalb so abstempelt."],

    },
    {

        correctIndex: 3,
        explanation: "Feuer spielt bei der Vernichtung von Hexen eine entscheidende Rolle. Vor allem sehr alte Hexen müssen verbrannt werden, um sicherzustellen, dass sie wirklich endgültig vergehen – genau das geschieht am Ende auch mit Ann Grays."

    {

        correctIndex: 2,
        explanation: "Die eingeschworene Kern-Gruppe, die sich den Gefahren der versteckten Hexenwelt im Waisenhaus St. Gray entgegenstellt, besteht aus den Park-Geschwistern, Samantha sowie Theo und Mary Norack."

];

let randomizedQuiz = [];
let currentQuestionIndex = 0;
let userAnswers = [];

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    // Zufällig 10 der 20 Fragen für eine Runde auswählen
    let shuffledQ = shuffleArray(quizData).slice(0, 10);

    randomizedQuiz = shuffledQ.map(q => {
        let optionsWithMeta = q.options.map((opt, idx) => ({
            text: opt,
            isCorrect: idx === q.correctIndex
        }));

        let shuffledOptions = shuffleArray(optionsWithMeta);
        let newCorrectIndex = shuffledOptions.findIndex(opt => opt.isCorrect);

        return {
            question: q.question,
            options: shuffledOptions.map(opt => opt.text),
            correctIndex: newCorrectIndex,
            explanation: q.explanation
        };
    });

    currentQuestionIndex = 0;
    userAnswers = [];
    renderQuestion();
}
    function renderQuestion() {
    const q = randomizedQuiz[currentQuestionIndex];
    document.getElementById('progress-indicator').textContent = `Frage ${currentQuestionIndex + 1} von ${randomizedQuiz.length}`;
    
    const card = document.getElementById('active-question-card');
    
    let optionsHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
        optionsHTML += `
            <li class="option-item">
                <label class="option-label">
                    <input type="radio" name="current-option" value="${idx}" required>
                    ${letters[idx]}) ${opt}
                </label>
            </li>
        `;
    });

    card.innerHTML = `
        <div class="question-block">
            <div class="question-text">${q.question}</div>
            <ul class="options-list">${optionsHTML}</ul>
        </div>
    `;

    const btn = document.getElementById('btn-next');
    if (currentQuestionIndex === randomizedQuiz.length - 1) {
        btn.textContent = "Quiz auswerten";
    } else {
        btn.textContent = "Nächste Frage";
    }
}

function handleNextQuestion() {
    const selected = document.querySelector('input[name="current-option"]:checked');
    if (!selected) {
        alert("Bitte wähle eine Antwort aus, bevor du fortfährst!");
        return;
    }

    const selectedValue = parseInt(selected.value);
    userAnswers.push(selectedValue);

    currentQuestionIndex++;

    if (currentQuestionIndex < randomizedQuiz.length) {
        renderQuestion();
    } else {
        showResults();
    }
}
    function showResults() {
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    let score = 0;
    const total = randomizedQuiz.length;
    let reviewListHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    randomizedQuiz.forEach((q, index) => {
        const userAns = userAnswers[index];
        const isCorrect = userAns === q.correctIndex;
        if (isCorrect) score++;

        const userAnsText = userAns !== null ? `${letters[userAns]}) ${q.options[userAns]}` : "Keine Antwort";
        const correctAnsText = `${letters[q.correctIndex]}) ${q.options[q.correctIndex]}`;

        reviewListHTML += `
            <div class="review-item ${isCorrect ? 'is-correct' : 'is-wrong'}">
                <div style="font-weight: bold; margin-bottom: 5px;">${index + 1}. ${q.question}</div>
                <div>Deine Antwort: <span class="${isCorrect ? 'correct-answer-text' : 'wrong-answer-text'}">${userAnsText}</span></div>
                ${!isCorrect ? `<div>Richtige Antwort: <span class="correct-answer-text">${correctAnsText}</span></div>` : ''}
                <div class="explanation"><strong>Erklärung:</strong> ${q.explanation}</div>
            </div>
        `;
    });

    const percentage = Math.round((score / total) * 100);
    let emoji = '';
    let text = '';

    if (percentage < 50) {
        emoji = '😡';
        text = 'Hast du das Buch überhaupt angefasst? Lies es lieber nochmal bevor du dich hier erneut vor dem Rat Blamierst';
    } else if (percentage <= 60) {
        emoji = '🤨';
        text = 'Ein skeptischer Blick... Du kennst zwar ein paar Details, bist dir aber noch recht unsicher.';
    } else if (percentage <= 80) {
        emoji = '😏';
        text = 'Gar nicht übel! Du hast ein gutes Wissen über die Ereignisse in St. Gray.';
    } else if (percentage === 90) {
        emoji = '✨';
        text = 'Wow knapp vorbei am Nerd wissen. Das war sehr gut, aber es geht noch besser.';
    } else {
        emoji = '🧙‍♀️';
        text = 'Perfekt! Du kennst dich zu 100% aus und durchschaust selbst die geheimsten Rituale!';
    }

    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-percent').textContent = `${percentage}% (${score} von ${total} richtig)`;
    document.getElementById('result-text').textContent = text;
    document.getElementById('review-list').innerHTML = reviewListHTML;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initQuiz;
</script>

</body>
</html>
